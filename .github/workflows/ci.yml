name: Rust checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Build pinned Chisel helper from the locked Router revision
        run: |
          scripts/build_tunnel_helper.sh "$RUNNER_TEMP/trusted-router-tunnel"
          echo "TRUSTED_ROUTER_TUNNEL_BINARY=$RUNNER_TEMP/trusted-router-tunnel" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify OpenShell is present without default features
        run: cargo test --locked --no-default-features --test openshell
      - run: cargo test --locked --workspace --all-features
      - name: Verify pinned offline DCAP and signed public vectors
        run: |
          cargo fmt --manifest-path attestation/Cargo.toml -- --check
          cargo fmt --manifest-path guest/Cargo.toml -- --check
          cargo fmt --manifest-path guest-check/Cargo.toml -- --check
          cargo clippy --locked --manifest-path attestation/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path attestation/Cargo.toml
          cargo check --locked --manifest-path guest-check/Cargo.toml
      - run: python3 scripts/check_engine_features.py
      - name: Verify real Docker lifecycle and hard limits
        run: |
          docker pull alpine:3.21
          cargo test --locked --test docker -- --ignored
          cargo test --locked --test daemon -- --ignored
          cargo test --locked --all-features --test tee simulated_startup -- --ignored
          docker pull python:3.12-slim
          cargo test --locked --test data_plane -- --ignored
          cargo test --locked --test management -- --ignored
      - name: Verify stock Trustee sample evidence and startup
        env:
          TRUSTEE_TEST_ENDPOINT: http://127.0.0.1:50004
        run: |
          docker run --rm -d --name trustee-test -p 127.0.0.1:50004:50004 \
            -e QCNL_CONF_PATH=/run/dcap/qcnl.conf --tmpfs /run/dcap \
            ghcr.io/confidential-containers/staged-images/coco-as-grpc@sha256:f65a0a74972781d5a3a9595f6e1308b86343f940738a0b6a23c270a7e8bd065a
          trap 'docker rm -f trustee-test' EXIT
          python3 - <<'PYTHON'
          import socket, time
          for attempt in range(100):
              try:
                  with socket.create_connection(("127.0.0.1", 50004), timeout=1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError("Trustee did not start")
          PYTHON
          cargo test --locked --all-features --test tee stock_trustee -- --ignored
