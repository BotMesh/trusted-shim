syntax = "proto3";
package trusted.ledger.v1;

// Central policy-gateway service. No operator/write-policy APIs are exported.
// Authorization metadata carries an allocation-scoped, expiring credential.
service AuthorizationLedger {
  rpc Reserve(ReserveRequest) returns (Grant);
  rpc Consume(ConsumeRequest) returns (ConsumeResponse);
}

// JSON bytes use the strict version-pinned Rail/contracts serde schema.
message ReserveRequest {
  bytes decision_json = 1;
  bytes proof_evidence = 2;
}
message Grant {
  string id = 1;
  bytes credential = 2;
  bytes execution_json = 3;
  string request_sha256 = 4;
  uint64 not_before = 5;
  uint64 expires_at = 6;
}
message ConsumeRequest {
  Grant grant = 1;
  bytes execution_json = 2;
  string request_sha256 = 3;
}
message ConsumeResponse {}
